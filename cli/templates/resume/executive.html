<title>Resume</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; color: #1f2a38; background: #fff; }
.page { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 16mm 18mm; border-left: 8mm solid #1f344d; }
header { border-bottom: 2px solid #1f344d; padding-bottom: 3.5mm; }
h1 { font-size: 21pt; }
.headline { color: #6c5537; font-size: 11pt; margin-top: 1mm; }
.contact { display: flex; flex-wrap: wrap; gap: 1.5mm 5mm; margin-top: 2.5mm; font-size: 9.5pt; color: #41505e; }
a { color: #41505e; text-decoration: none; }
section { margin-top: 5mm; }
h2 { font-size: 10.5pt; color: #1f344d; border-bottom: 1px solid #b9c3cc; padding-bottom: .8mm; }
.summary { line-height: 1.5; margin-top: 1mm; }
.entry { margin-top: 2.5mm; }
.row { display: flex; justify-content: space-between; gap: 5mm; }
.org { color: #6c5537; }
.org::before { content: " · "; }
.date { color: #596672; font-size: 9.5pt; }
ul { list-style: square; margin: 1mm 0 0 5mm; }
li { line-height: 1.42; margin-top: .7mm; }
.skill-group, .line, .entry p { margin-top: 1mm; line-height: 1.45; }
@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
