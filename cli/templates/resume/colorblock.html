<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; color: #262626; background: #fff; }
.page { width: 210mm; min-height: 297mm; margin: 0 auto; }
header { background: #e4572e; color: #fff; padding: 11mm 15mm 7mm; }
h1 { font-size: 22pt; }
.headline { font-size: 11pt; opacity: .92; margin-top: 1mm; }
.contact { display: flex; flex-wrap: wrap; gap: 1.5mm 5mm; margin-top: 3mm; font-size: 9.2pt; }
.contact span, .contact a { color: #fff; }
a { text-decoration: none; }
main > section { padding: 0 15mm; }
section { margin-top: 4.5mm; }
h2 { font-size: 10pt; color: #e4572e; }
.summary { line-height: 1.42; margin-top: 1mm; }
.entry { margin-top: 2.2mm; border-top: 1px solid #e9e9e9; padding-top: 1.5mm; }
.row { display: flex; justify-content: space-between; gap: 4mm; }
.org { color: #a63b1f; }
.org::before { content: " · "; }
.date { color: #666; font-size: 9pt; }
ul { list-style: none; margin-top: .8mm; }
li { padding-left: 4mm; position: relative; line-height: 1.36; margin-top: .5mm; }
li::before { content: ""; position: absolute; left: 0; top: 1.4mm; width: 1.7mm; height: 1.7mm; background: #2f9c95; }
.skill-group, .line, .entry p { margin-top: .8mm; line-height: 1.4; }
@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body data-template="colorblock">
<main class="page"><!--GY:RESUME_CONTENT--></main>
</body>
</html>
