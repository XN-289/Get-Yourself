<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, "Microsoft YaHei", sans-serif; color: #20252a; background: #fff; }
.page { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 12mm 13mm; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 6mm; border-bottom: 2px solid #176b5c; padding-bottom: 2.5mm; }
h1 { font-size: 18pt; }
.headline { color: #176b5c; font-family: Consolas, "Courier New", monospace; font-size: 10pt; margin-top: 1mm; }
.contact { display: flex; flex-direction: column; align-items: flex-end; gap: .7mm; font-size: 9pt; color: #4b545c; }
a { color: #176b5c; text-decoration: none; }
section { margin-top: 3.8mm; }
h2 { font-size: 9.5pt; color: #fff; background: #176b5c; display: inline-block; padding: .7mm 2mm; }
.summary { margin-top: 1.2mm; line-height: 1.35; }
.entry { margin-top: 2mm; border-left: 1px solid #ccd3d7; padding-left: 2.5mm; }
.row { display: flex; justify-content: space-between; gap: 4mm; }
.org { color: #176b5c; }
.org::before { content: " | "; color: #879198; }
.date { font-family: Consolas, monospace; font-size: 9pt; color: #586269; }
ul { list-style: none; margin-top: .8mm; }
li { line-height: 1.33; margin-top: .5mm; }
li::before { content: "=> "; color: #176b5c; font-family: Consolas, monospace; font-size: 8.5pt; }
.skill-group, .line, .entry p { margin-top: .8mm; line-height: 1.35; }
@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body data-template="tech-compact">
<main class="page"><!--GY:RESUME_CONTENT--></main>
</body>
</html>
