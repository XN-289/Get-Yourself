<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Helvetica, Arial, sans-serif; color: #111; background: #fff; }
.page { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 13mm 12mm; }
header { display: grid; grid-template-columns: 1fr 1fr; border-top: 5px solid #d92b1c; border-bottom: 1px solid #111; padding: 3mm 0; }
h1 { font-size: 21pt; line-height: 1; }
.headline { grid-column: 1; grid-row: 2; margin-top: 1.5mm; font-size: 10pt; }
.contact { grid-column: 2; grid-row: 1 / 3; justify-self: end; align-self: center; text-align: right; font-size: 9pt; line-height: 1.5; }
.contact span { display: block; }
a { color: #d92b1c; text-decoration: none; }
section { margin-top: 5mm; display: grid; grid-template-columns: 34mm 1fr; gap: 5mm; }
h2 { grid-column: 1; font-size: 10pt; }
h2::after { content: ""; display: block; width: 12mm; height: 2.5px; background: #d92b1c; margin-top: 1mm; }
h2 + *, section > article:first-of-type { grid-column: 2; }
.summary, .skill-group { grid-column: 2; }
.entry { grid-column: 2; margin-top: 2mm; }
.row { display: block; }
.org::before { content: " / "; }
.date { display: block; font-size: 9pt; color: #555; margin-top: .4mm; }
ul { list-style: none; margin-top: .8mm; }
li { line-height: 1.36; margin-top: .5mm; }
li::before { content: "— "; color: #d92b1c; }
.line, .entry p { grid-column: 2; margin-top: .8mm; line-height: 1.4; }
@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body data-template="swiss">
<main class="page"><!--GY:RESUME_CONTENT--></main>
</body>
</html>
