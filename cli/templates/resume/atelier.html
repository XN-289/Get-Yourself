<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Helvetica Neue", Arial, sans-serif; color: #202020; background: #fff; }
.page { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 20mm 19mm; }
header { display: grid; grid-template-columns: 1fr 3fr 1fr; align-items: end; gap: 5mm; }
h1 { grid-column: 2; font-size: 19pt; font-weight: 300; text-align: center; }
.headline { grid-column: 2; text-align: center; color: #777; font-size: 10pt; margin-top: 1mm; }
.contact { grid-column: 3; text-align: right; font-size: 9pt; color: #636363; line-height: 1.5; }
.contact span { display: block; }
a { color: inherit; text-decoration: none; border-bottom: 1px solid #d4d4d4; }
header::after { content: ""; grid-column: 1 / 4; height: 1px; background: #202020; margin-top: 5mm; }
section { margin-top: 6mm; }
h2 { font-size: 9pt; color: #8a8a8a; font-weight: 500; }
.summary { max-width: 145mm; line-height: 1.6; margin-top: 1mm; }
.entry { margin-top: 3mm; display: grid; grid-template-columns: 38mm 1fr; gap: 5mm; }
.row { display: contents; }
.row div:first-child { grid-column: 2; }
.date { grid-column: 1; grid-row: 1; font-size: 9pt; color: #636363; padding-top: .5mm; }
.org { color: #4d4d4d; }
.org::before { content: " / "; color: #a5a5a5; }
ul { list-style: none; margin-top: .8mm; }
li { line-height: 1.48; margin-top: .8mm; }
.skill-group, .line, .entry p { margin-top: .8mm; line-height: 1.5; }
@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body data-template="atelier">
<main class="page"><!--GY:RESUME_CONTENT--></main>
</body>
</html>
